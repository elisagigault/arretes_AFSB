<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Arrêtés AFSB</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/-family:Arial;
}

#controls{
padding:10px;
background:white;
}

#map{
height:90vh;
}

</style>

</head>

<body>

<div id="controls">

Date de consultation :

<input type="date" id="dateSelect">

<button onclick="filterMap()">
Filtrer
</button>

<button onclick="resetMap()">
Tout afficher
</button>

</div>

<div id="map"></div>

<script src="https://flet/dist/leaflet.jsscript>

<script>

var map = L.map('map').setView([44.74,-0.53],13);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
maxZoom:19
}
).addTo(map);

var geojsonLayer;
var geojsonData;

fetch("arretes.geojson")
.then(r=>r.json())
.then(data=>{

geojsonData=data;

geojsonLayer=L.geoJSON(data,{
style: styleFeature,
onEachFeature: popupFeature
}).addTo(map);

});

function styleFeature(feature){

return{
color:"#ff3300",
weight:4,
fillOpacity:0.4
};

}

function popupFeature(feature,layer){

var p=feature.properties;

layer.bindPopup(
"<b>"+(p.numero||"Arrêté")+"</b><br>"+
"Début : "+(p.date_debut||"") +"<br>"+
"Fin : "+(p.date_fin||"")
);

}

function filterMap(){

var selectedDate=
document.getElementById("dateSelect").value;

if(!selectedDate){
return;
}

if(geojsonLayer){
map.removeLayer(geojsonLayer);
}

geojsonLayer=L.geoJSON(geojsonData,{

filter:function(feature){

var debut=new Date(feature.properties.date_debut);

var fin=new Date(feature.properties.date_fin);

var test=new Date(selectedDate);

return (
test>=debut &&
test<=fin
);

},

style:styleFeature,
onEachFeature:popupFeature

}).addTo(map);

}

function resetMap(){

if(geojsonLayer){
map.removeLayer(geojsonLayer);
}

geojsonLayer=L.geoJSON(geojsonData,{
style:styleFeature,
onEachFeature:popupFeature
}).addTo(map);

}

</script>

</body>
</html>
