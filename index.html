<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Arrêtés</title>

<link rel="stylesheet"
href="https://unpkg.comtyle>
#map{
height:90vh;
}

.menu{
padding:10px;
background:white;
}
</style>
</head>

<body>

<div class="menu">
Début :
<input type="date" id="debut">

Fin :
<input type="date" id="fin">

<button onclick="filtrer()">
Filtrer
</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/ipt>

<script>

var map = L.map('map')
.setView([44.74,-0.53],13);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

var couche;

fetch('arretes.geojson')
.then(r=>r.json())
.then(data=>{

window.dataGeojson=data;

couche=L.geoJSON(data,{
onEachFeature:function(feature,layer){

layer.bindPopup(
feature.properties.numero
);

}
}).addTo(map);

});

function filtrer(){

var d1=document.getElementById("debut").value;
var d2=document.getElementById("fin").value;

map.removeLayer(couche);

couche=L.geoJSON(dataGeojson,{

filter:function(feature){

return (
feature.properties.date_debut <= d2 &&
feature.properties.date_fin >= d1
);

}

}).addTo(map);

}

</script>

</body>
</html>
