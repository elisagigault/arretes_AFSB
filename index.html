<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Arrêtés des AFSB</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
margin:0;
padding:0;
height:100%;
font-family:Arial,sans-serif;
}

h2{
margin:10px;
}

#toolbar{
padding:10px;
background:white;
border-bottom:1px solid #ccc;
display:flex;
flex-wrap:wrap;
gap:10px;
align-items:center;
}

#types{
padding:10px;
background:white;
border-bottom:1px solid #ccc;
}

#map{
height:calc(100vh - 145px);
}

.legend{
background:white;
padding:10px;
line-height:22px;
border-radius:5px;
box-shadow:0 0 5px rgba(0,0,0,0.3);
}

.color-box{
display:inline-block;
width:15px;
height:15px;
margin-right:5px;
}

input[type=text]{
width:140px;
}

</style>

</head>

<body>

<h2>Arrêtés des AFSB</h2>

<div id="toolbar">

<label>Date début :</label>
<input type="date" id="dateDebut">

<label>Date fin :</label>
<input type="date" id="dateFin">

<label>Recherche arrêté :</label>
<input type="text" id="rechercheArrete" placeholder="2026-0084">

<button onclick="filtrerPeriode()">
Filtrer
</button>

<button onclick="afficherTous()">
Tout afficher
</button>

</div>

<div id="types">

<label>
<input type="checkbox" class="typeFilter" value="Circulation alternée" checked>
Circulation alternée
</label>

<label>
<input type="checkbox" class="typeFilter" value="Route barrée" checked>
Route barrée
</label>

<label>
<input type="checkbox" class="typeFilter" value="Déviation" checked>
Déviation
</label>

<label>
<input type="checkbox" class="typeFilter" value="Circulation restreinte" checked>
Circulation restreinte
</label>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([44.74,-0.53],13);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
maxZoom:20,
attribution:'Esri'
}
).addTo(map);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
opacity:0.35
}
).addTo(map);

let donnees;
let couche;

function parseDate(v){

if(!v || v==="NULL")
return null;

if(v.includes("/")){

const p=v.split("/");

return new Date(
Number(p[2]),
Number(p[1])-1,
Number(p[0])
);

}

return new Date(v);

}

function getColor(type){

switch(type){

case "Route barrée":
return "#e60000";

case "Déviation":
return "#00aa00";

case "Circulation alternée":
return "#ffd700";

case "Circulation restreinte":
return "#8000ff";

default:
return "#3388ff";

}

}

function getTypesSelectionnes(){

return Array.from(
document.querySelectorAll(".typeFilter:checked")
).map(c=>c.value);

}

function dessiner(data){

if(couche){
map.removeLayer(couche);
}

couche=L.geoJSON(data,{

style:function(feature){

const type=
feature.properties["Type"];

const estDemande =
feature.properties["Arrêté"] ===
"Demande en cours";

return{

color:getColor(type),
fillColor:getColor(type),

weight:2,

fillOpacity:
type==="Déviation"
?0.15
:0.25,

dashArray:
estDemande
?"8 8"
:null

};

},

onEachFeature:function(feature,layer){

layer.bindTooltip(

"<b>Arrêté :</b> "
+(feature.properties["Arrêté"]||"")

+"<br><b>Description :</b> "
+(feature.properties["description"]||"")

+"<br><b>Type :</b> "
+(feature.properties["Type"]||"")

+"<br><b>Date début :</b> "
+(feature.properties["Date début"]||"")

+"<br><b>Date fin :</b> "
+(feature.properties["Date fin"]||""),

{
sticky:true
}

);

}

}).addTo(map);

}

function filtrerPeriode(){

const types =
getTypesSelectionnes();

const recherche =
document
.getElementById("rechercheArrete")
.value
.toLowerCase()
.trim();

const debutFiltre =
document.getElementById("dateDebut").value
?
new Date(
document
.getElementById("dateDebut")
.value
)
:null;

const finFiltre =
document.getElementById("dateFin").value
?
new Date(
document
.getElementById("dateFin")
.value
)
:null;

const resultat={

type:"FeatureCollection",

features:donnees.features.filter(f=>{

const type =
f.properties["Type"];

if(!types.includes(type))
return false;

const numero =
String(
f.properties["Arrêté"] || ""
).toLowerCase();

if(
recherche &&
!numero.includes(recherche)
){
return false;
}

const debut =
parseDate(
f.properties["Date début"]
);

let fin =
parseDate(
f.properties["Date fin"]
);

if(!fin){

fin =
new Date(
2999,11,31
);

}

if(
debutFiltre &&
finFiltre
){

return (
debut <= finFiltre &&
fin >= debutFiltre
);

}

if(debutFiltre){

return (
fin >= debutFiltre
);

}

if(finFiltre){

return (
debut <= finFiltre
);

}

return true;

})

};

dessiner(resultat);

}

function afficherTous(){

document
.querySelectorAll(".typeFilter")
.forEach(c=>c.checked=true);

document
.getElementById("dateDebut")
.value="";

document
.getElementById("dateFin")
.value="";

document
.getElementById("rechercheArrete")
.value="";

dessiner(donnees);

}

fetch("Arretes circulation.geojson")

.then(r=>r.json())

.then(data=>{

donnees=data;

const aujourdHui =
new Date();

const actifs = {

type:"FeatureCollection",

features:data.features.filter(f=>{

const debut =
parseDate(
f.properties["Date début"]
);

let fin =
parseDate(
f.properties["Date fin"]
);

if(!fin){

fin =
new Date(
2999,11,31
);

}

return (
aujourdHui>=debut &&
aujourdHui<=fin
);

})

};

dessiner(actifs);

if(couche.getBounds().isValid()){

map.fitBounds(
couche.getBounds()
);

}

});

document
.querySelectorAll(".typeFilter")
.forEach(c=>{

c.addEventListener(
"change",
filtrerPeriode
);

});

const legend =
L.control(
{position:'bottomright'}
);

legend.onAdd=function(){

const div =
L.DomUtil.create(
'div',
'legend'
);

div.innerHTML=

'<div><span class="color-box" style="background:#e60000"></span>Route barrée</div>'+
'<div><span class="color-box" style="background:#00aa00"></span>Déviation</div>'+
'<div><span class="color-box" style="background:#ffd700"></span>Circulation alternée</div>'+
'<div><span class="color-box" style="background:#8000ff"></span>Circulation restreinte</div>'+
'<hr>'+
'<div><i>Trait pointillé = Demande en cours</i></div>';

return div;

};

legend.addTo(map);

</script>

</body>
</html>
