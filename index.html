<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Carte des arrêtés AFSB</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #toolbar {
            padding: 10px;
            background: white;
            border-bottom: 1px solid #ccc;
        }

        #map {
            height: calc(100vh - 60px);
        }

        button {
            margin-left: 5px;
        }
    </style>
</head>

<body>

    <div id="toolbar">
        <label>Date de consultation :</label>

        <input type="date" id="dateSelect">

        <button onclick="filtrerDate()">
            Afficher les arrêtés actifs
        </button>

        <button onclick="afficherTous()">
            Tout afficher
        </button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        const map = L.map("map").setView([44.74, -0.53], 13);

        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 20,
                attribution: "Esri"
            }
        ).addTo(map);

        let donneesGeojson;
        let couche;

        function parseDate(valeur) {

            if (!valeur) return null;

            if (valeur.includes("/")) {

                const morceaux = valeur.split("/");

                return new Date(
                    Number(morceaux[2]),
                    Number(morceaux[1]) - 1,
                    Number(morceaux[0])
                );

            }

            return new Date(valeur);

        }

        function afficherTous() {

            if (couche) {
                map.removeLayer(couche);
            }

            couche = L.geoJSON(donneesGeojson).addTo(map);

        }

        function filtrerDate() {

            const valeurDate =
                document.getElementById("dateSelect").value;

            if (!valeurDate) {
                alert("Choisissez une date");
                return;
            }

            const dateChoisie = new Date(valeurDate);

            const resultat = {
                type: "FeatureCollection",
                features: donneesGeojson.features.filter(feature => {

                    const debut =
                        parseDate(feature.properties["Date début"]);

                    const fin =
                        parseDate(feature.properties["Date fin"]);

                    if (!debut || !fin) {
                        return false;
                    }

                    return (
                        dateChoisie >= debut &&
                        dateChoisie <= fin
                    );

                })
            };

            if (couche) {
                map.removeLayer(couche);
            }

            couche = L.geoJSON(resultat).addTo(map);

        }

        fetch("Arretes circulation.geojson")
            .then(response => response.json())
            .then(data => {

                donneesGeojson = data;

                couche = L.geoJSON(data).addTo(map);

                if (couche.getBounds().isValid()) {
                    map.fitBounds(couche.getBounds());
                }

            })
            .catch(error => {
                console.error(error);
                alert("Impossible de charger le fichier GeoJSON");
            });

    </script>

</body>

</html>
