<!DOCTYPE html>
<html lang=
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Carte des arrêtés AFSB</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

#toolbar {
    padding: 10px;
    background: white;
    border-bottom: 1px solid #ccc;
}

#map {
    height: calc(100vh - 55px);
}

</style>

</head>

<body>

<div id="toolbar">

<label>Date de consultation :</label>

<input type="date" id="dateSelect">

<button onclick="filtrerDate()">
Afficher les arrêtés actifs
</button>

<button onclick="afficherTous()">
Tout afficher
</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([44.74,-0.53],13);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
    maxZoom:20
}
).addTo(map);

let donneesGeojson;
let couche;

function afficherTous(){

    if(couche){
        map.removeLayer(couche);
    }

    couche = L.geoJSON(donneesGeojson).addTo(map);

}

function filtrerDate(){

    const dateChoisie =
        new Date(document.getElementById("dateSelect").value);

    if(couche){
        map.removeLayer(couche);
    }

    const resultat = {
        "type":"FeatureCollection",
        "features": donneesGeojson.features.filter(f => {

            const debut =
                new Date(f.properties["Date début"]);

            const fin =
                new Date(f.properties["Date fin"]);

            return (
                dateChoisie >= debut &&
                dateChoisie <= fin
            );

        })
    };

    couche = L.geoJSON(resultat).addTo(map);

}

fetch("arr_t_s_afsb.geojson")
.then(r => r.json())
.then(data => {

    donneesGeojson = data;

    couche = L.geoJSON(data).addTo(map);

    map.fitBounds(couche.getBounds());

});

</script>

</body>
</html>
