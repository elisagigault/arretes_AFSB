<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Carte des arrêtés AFSB</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/gin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

#toolbar {
    padding: 10px;
    background: white;
    border-bottom: 1px solid #ccc;
}

#map {
    height: calc(100vh - 55px);
}

button {
    padding: 6px 12px;
    margin-left: 5px;
    cursor: pointer;
}

input[type="date"] {
    padding: 5px;
}

</style>
</head>

<body>

<div id="toolbar">

<label><b>Date de consultation :</b></label>

<input type="date" id="dateSelect">

<button onclick="filtrerDate()">
Afficher les arrêtés actifs
</button>

<button onclick="afficherTous()">
Tout afficher
</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leafletscript>

let map = L.map('map').setView([44.74, -0.53], 13);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
    attribution: 'Esri World Imagery',
    maxZoom: 20
}
).addTo(map);

let donneesGeojson;
let coucheArretes;

function convertirDate(valeur){

    if(!valeur) return null;

    if(valeur.includes('/')){

        let morceaux = valeur.split('/');

        return new Date(
            morceaux[2],
            morceaux[1]-1,
            morceaux[0]
        );
    }

    return new Date(valeur);
}

function creerPopup(feature){

    let html = "";

    for(let cle in feature.properties){

        html +=
        "<b>" + cle + "</b> : "
        + feature.properties[cle]
        + "<br>";
    }

    return html;
}

function styleFeature(feature){

    return {
        color: "#e60000",
        weight: 4,
        fillColor: "#ff7f00",
        fillOpacity: 0.4
    };
}

function dessinerCarte(geojson){

    if(coucheArretes){
        map.removeLayer(coucheArretes);
    }

    coucheArretes = L.geoJSON(geojson, {

        style: styleFeature,

        onEachFeature: function(feature, layer){

            layer.bindPopup(
                creerPopup(feature)
            );

        }

    }).addTo(map);
}

fetch("Arretes circulation.geojson")

.then(response => response.json())

.then(data => {

    donneesGeojson = data;

    dessinerCarte(data);

    if(coucheArretes.getBounds().isValid()){
        map.fitBounds(
            coucheArretes.getBounds()
        );
    }

});

function filtrerDate(){

    let dateChoisie =
        document.getElementById("dateSelect").value;

    if(!dateChoisie){

        alert("Veuillez sélectionner une date.");

        return;
    }

    let dateTest = new Date(dateChoisie);

    let resultat = {

        type: "FeatureCollection",

        features: donneesGeojson.features.filter(function(feature){

            let debut =
                convertirDate(
                    feature.properties["Date début"]
                );

            let fin =
                convertirDate(
                    feature.properties["Date fin"]
                );

            if(!debut || !fin){
                return false;
            }

            return (
                dateTest >= debut &&
                dateTest <= fin
            );

        })

    };

    dessinerCarte(resultat);
}

function afficherTous(){

    dessinerCarte(
        donneesGeojson
    );
}

</script>

</body>

</html>
